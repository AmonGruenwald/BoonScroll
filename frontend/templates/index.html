<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoonScroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
<div id="app">

  <!-- ===== User-select screen ===== -->
  <div id="screen-users" class="screen active">
    <div class="user-select-wrap">
      <div class="logo">
        <!-- BoonScroll mark: a leaf unfurling into a scroll/feed -->
        <svg class="logo-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#1F6B47"/>
          <!-- scroll lines -->
          <rect x="14" y="14" width="20" height="3" rx="1.5" fill="white" opacity=".35"/>
          <rect x="14" y="20" width="20" height="3" rx="1.5" fill="white" opacity=".35"/>
          <rect x="14" y="26" width="13" height="3" rx="1.5" fill="white" opacity=".35"/>
          <!-- leaf growing from the scroll -->
          <path d="M30 26 C30 20 36 16 40 14 C40 20 38 28 30 30 L30 26Z" fill="white" opacity=".9"/>
          <path d="M30 30 L36 20" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
        </svg>
        <div class="logo-text">
          <h1>BoonScroll</h1>
          <p class="tagline">Your daily dose. Nothing more.</p>
        </div>
      </div>
      <div id="user-list" class="user-list"></div>
      <button class="btn add-user-btn" id="show-add-user">+ Add person</button>
    </div>
  </div>

  <!-- ===== Add-user modal ===== -->
  <div id="modal-add-user" class="modal hidden">
    <div class="modal-box">
      <h2>Create profile</h2>
      <div class="form-group">
        <label>Display name</label>
        <input type="text" id="new-display-name" placeholder="e.g. Alex" maxlength="50" />
      </div>
      <div class="form-group">
        <label>Username (used in URLs)</label>
        <input type="text" id="new-username" placeholder="e.g. alex" maxlength="30" />
      </div>
      <div class="form-group">
        <label>Colour</label>
        <div class="color-picker" id="color-picker"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancel-add-user">Cancel</button>
        <button class="btn btn-primary" id="save-add-user">Create</button>
      </div>
    </div>
  </div>

  <!-- ===== Feed screen ===== -->
  <div id="screen-feed" class="screen hidden">

    <header class="app-header">
      <!-- Logo (desktop) -->
      <div class="header-logo">
        <svg class="logo-mark-sm" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#1F6B47"/>
          <rect x="14" y="14" width="20" height="3" rx="1.5" fill="white" opacity=".35"/>
          <rect x="14" y="20" width="20" height="3" rx="1.5" fill="white" opacity=".35"/>
          <rect x="14" y="26" width="13" height="3" rx="1.5" fill="white" opacity=".35"/>
          <path d="M30 26 C30 20 36 16 40 14 C40 20 38 28 30 30 L30 26Z" fill="white" opacity=".9"/>
          <path d="M30 30 L36 20" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
        </svg>
        BoonScroll
      </div>

      <!-- Date nav -->
      <div class="date-nav">
        <button class="icon-btn date-arrow" id="prev-date" title="Previous day">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
        </button>
        <span class="current-date" id="current-date-label"></span>
        <button class="icon-btn date-arrow" id="next-date" title="Next day">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
        </button>
      </div>

      <!-- Actions -->
      <div class="header-actions">
        <!-- User avatar + name (desktop, acts as profile button) -->
        <button class="icon-btn" id="open-interests" title="Interests" style="border-radius:8px;padding:4px 8px;gap:6px;font-size:13px;font-weight:600;color:var(--text-meta)">
          <svg viewBox="0 0 20 20" fill="currentColor" style="width:16px;height:16px"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
          Interests
        </button>
        <button class="icon-btn" id="trigger-generate" title="Refresh feed">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
        </button>
        <button class="icon-btn danger" id="logout-btn" title="Switch user">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/></svg>
        </button>
      </div>
    </header>

    <main class="feed-main">
      <div id="feed-empty" class="feed-empty hidden">
        <div class="empty-icon">🌱</div>
        <h2>No feed yet</h2>
        <p>Feeds generate at 5:00 AM daily.<br>Hit refresh to build one now.</p>
      </div>
      <div id="feed-loading" class="feed-loading hidden">
        <div class="spinner"></div>
      </div>
      <div id="feed-list" class="feed-list"></div>
    </main>

    <!-- Mobile bottom nav -->
    <nav class="bottom-nav">
      <button class="bottom-nav-btn" id="bnav-prev">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
        <span>Older</span>
      </button>
      <button class="bottom-nav-btn" id="bnav-interests">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
        <span>Interests</span>
      </button>
      <button class="bottom-nav-btn" id="bnav-refresh">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
        <span>Refresh</span>
      </button>
      <button class="bottom-nav-btn" id="bnav-logout">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/></svg>
        <span>Log out</span>
      </button>
      <button class="bottom-nav-btn" id="bnav-next">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
        <span>Newer</span>
      </button>
    </nav>
  </div>

  <!-- ===== Interests panel ===== -->
  <div id="panel-interests" class="side-panel hidden">
    <div class="panel-header">
      <h2>Your interests</h2>
      <button class="icon-btn" id="close-interests">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      </button>
    </div>
    <p class="panel-hint">Describe what you care about — be specific. Better descriptions → better feed.</p>
    <div id="interests-list" class="interests-list"></div>
    <div class="add-interest-form">
      <textarea id="new-interest-text" placeholder="e.g. Formula 1 technical regulations and race strategy" rows="3"></textarea>
      <button class="btn btn-primary" id="save-interest">Add interest</button>
    </div>
  </div>

  <!-- ===== Shared-item screen ===== -->
  <div id="screen-shared" class="screen hidden">
    <header class="app-header shared-header">
      <div class="logo-small">
        <svg viewBox="0 0 48 48" fill="none" style="width:26px;height:26px">
          <rect width="48" height="48" rx="12" fill="#1F6B47"/>
          <rect x="14" y="14" width="20" height="3" rx="1.5" fill="white" opacity=".35"/>
          <rect x="14" y="20" width="20" height="3" rx="1.5" fill="white" opacity=".35"/>
          <rect x="14" y="26" width="13" height="3" rx="1.5" fill="white" opacity=".35"/>
          <path d="M30 26 C30 20 36 16 40 14 C40 20 38 28 30 30 L30 26Z" fill="white" opacity=".9"/>
        </svg>
        BoonScroll
      </div>
      <a href="/" class="btn btn-outline btn-sm">Open app</a>
    </header>
    <main class="shared-main">
      <div id="shared-card-wrap"></div>
    </main>
  </div>

  <div id="share-toast" class="toast hidden"></div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
