<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoonScroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div id="app">

    <!-- ===== User selection screen ===== -->
    <div id="screen-users" class="screen active">
      <div class="user-select-wrap">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="20" fill="#FF4500"/>
            <path d="M33 20c0-1.1-.9-2-2-2-.5 0-1 .2-1.3.5-1.4-.9-3.2-1.5-5.2-1.6l.9-4.1 2.8.6c0 .8.7 1.4 1.5 1.4s1.5-.7 1.5-1.5-.7-1.5-1.5-1.5c-.6 0-1.1.4-1.4.9l-3.1-.7c-.2 0-.3.1-.4.3l-1 4.6c-2 .1-3.8.7-5.2 1.6-.4-.3-.8-.5-1.3-.5-1.1 0-2 .9-2 2 0 .8.4 1.4 1 1.8 0 .2-.1.4-.1.6 0 3 3.4 5.4 7.6 5.4s7.6-2.4 7.6-5.4c0-.2 0-.4-.1-.6.5-.4.9-1 .9-1.8zm-13 1c0-.8.7-1.5 1.5-1.5s1.5.7 1.5 1.5-.7 1.5-1.5 1.5-1.5-.7-1.5-1.5zm8.4 3.9c-1 1-2.5 1.4-4.4 1.4s-3.4-.5-4.4-1.4c-.2-.2-.2-.5 0-.7s.5-.2.7 0c.8.8 2 1.2 3.7 1.2s2.9-.4 3.7-1.2c.2-.2.5-.2.7 0s.2.5 0 .7zm-.4-2.4c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5z" fill="white"/>
          </svg>
          <div>
            <h1>BoonScroll</h1>
            <p class="tagline">Your daily dose. Nothing more.</p>
          </div>
        </div>
        <div id="user-list" class="user-list"></div>
        <button class="btn btn-outline add-user-btn" id="show-add-user">+ Add person</button>
      </div>
    </div>

    <!-- ===== Add user modal ===== -->
    <div id="modal-add-user" class="modal hidden">
      <div class="modal-box">
        <h2>Who are you?</h2>
        <div class="form-group">
          <label>Display name</label>
          <input type="text" id="new-display-name" placeholder="e.g. Alex" maxlength="50" />
        </div>
        <div class="form-group">
          <label>Username (used in URLs)</label>
          <input type="text" id="new-username" placeholder="e.g. alex" maxlength="30" />
        </div>
        <div class="form-group">
          <label>Pick a colour</label>
          <div class="color-picker" id="color-picker"></div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="cancel-add-user">Cancel</button>
          <button class="btn btn-primary" id="save-add-user">Create profile</button>
        </div>
      </div>
    </div>

    <!-- ===== Main feed screen ===== -->
    <div id="screen-feed" class="screen hidden">

      <!-- Top header -->
      <header class="app-header">
        <button class="icon-btn" id="back-to-users" title="Switch user">
          <div class="avatar sm" id="header-avatar"></div>
        </button>

        <div class="date-nav">
          <button class="icon-btn date-arrow" id="prev-date" title="Previous day">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
          </button>
          <span class="current-date" id="current-date-label"></span>
          <button class="icon-btn date-arrow" id="next-date" title="Next day">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
          </button>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="open-interests" title="Interests">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
          </button>
          <button class="icon-btn refresh-icon" id="trigger-generate" title="Refresh feed">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </header>

      <!-- Feed -->
      <main class="feed-main">
        <div id="feed-empty" class="feed-empty hidden">
          <div class="empty-icon">🌱</div>
          <h2>No feed yet</h2>
          <p>Feeds are generated daily at 5:00 AM.<br>Hit the refresh button to generate one now.</p>
        </div>
        <div id="feed-loading" class="feed-loading hidden">
          <div class="spinner"></div>
        </div>
        <div id="feed-list" class="feed-list"></div>
      </main>

      <!-- Mobile bottom nav -->
      <nav class="bottom-nav">
        <button class="bottom-nav-btn" id="bnav-prev">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd"/></svg>
          <span>Older</span>
        </button>
        <button class="bottom-nav-btn" id="bnav-interests">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
          <span>Interests</span>
        </button>
        <button class="bottom-nav-btn" id="bnav-refresh">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
          <span>Refresh</span>
        </button>
        <button class="bottom-nav-btn" id="bnav-user">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
          <span>Profile</span>
        </button>
        <button class="bottom-nav-btn" id="bnav-next">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd"/></svg>
          <span>Newer</span>
        </button>
      </nav>
    </div>

    <!-- ===== Interests panel ===== -->
    <div id="panel-interests" class="side-panel hidden">
      <div class="panel-header">
        <h2>Your interests</h2>
        <button class="icon-btn" id="close-interests">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <p class="panel-hint">Describe what you care about. The more specific, the better your feed.</p>
      <div id="interests-list" class="interests-list"></div>
      <div class="add-interest-form">
        <textarea id="new-interest-text" placeholder="e.g. Formula 1 racing, especially technical regulations" rows="3"></textarea>
        <button class="btn btn-primary" id="save-interest">Add interest</button>
      </div>
    </div>

    <!-- ===== Shared item screen ===== -->
    <div id="screen-shared" class="screen hidden">
      <header class="app-header shared-header">
        <div class="logo-small">
          <svg class="logo-icon-sm" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="#FF4500"/><path d="M33 20c0-1.1-.9-2-2-2-.5 0-1 .2-1.3.5-1.4-.9-3.2-1.5-5.2-1.6l.9-4.1 2.8.6c0 .8.7 1.4 1.5 1.4s1.5-.7 1.5-1.5-.7-1.5-1.5-1.5c-.6 0-1.1.4-1.4.9l-3.1-.7c-.2 0-.3.1-.4.3l-1 4.6c-2 .1-3.8.7-5.2 1.6-.4-.3-.8-.5-1.3-.5-1.1 0-2 .9-2 2 0 .8.4 1.4 1 1.8 0 .2-.1.4-.1.6 0 3 3.4 5.4 7.6 5.4s7.6-2.4 7.6-5.4c0-.2 0-.4-.1-.6.5-.4.9-1 .9-1.8zm-13 1c0-.8.7-1.5 1.5-1.5s1.5.7 1.5 1.5-.7 1.5-1.5 1.5-1.5-.7-1.5-1.5zm8.4 3.9c-1 1-2.5 1.4-4.4 1.4s-3.4-.5-4.4-1.4c-.2-.2-.2-.5 0-.7s.5-.2.7 0c.8.8 2 1.2 3.7 1.2s2.9-.4 3.7-1.2c.2-.2.5-.2.7 0s.2.5 0 .7zm-.4-2.4c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5z" fill="white"/></svg>
          BoonScroll
        </div>
        <a href="/" class="btn btn-outline btn-sm">Open app</a>
      </header>
      <main class="shared-main">
        <div id="shared-card-wrap"></div>
      </main>
    </div>

    <!-- Toast -->
    <div id="share-toast" class="toast hidden"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
